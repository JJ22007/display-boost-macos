name: Publish macOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Support/Info.plist
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and package both architectures
        run: ./script/package_release.sh
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increment the app version to publish a new release."
            exit 1
          fi
          shasum -a 256 outputs/Display-Boost-universal.zip > outputs/SHA256SUMS.txt
          gh release create "$tag" \
            outputs/Display-Boost-universal.zip outputs/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Display Boost $version" \
            --notes-file RELEASE_NOTES.md
